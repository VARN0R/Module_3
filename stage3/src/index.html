<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPBrest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="modal-window" id="modalWindow">
      <form class="add-image-form" id="addImageForm">
        <div class="form-group">
          <label for="imageName">Image Name:</label>
          <input type="text" id="imageName" name="imageName" required />
        </div>
        <div class="form-group">
          <label for="imageFile">Select Image:</label>
          <input
            type="file"
            id="imageFile"
            name="imageFile"
            accept="image/*"
            required
          />
        </div>
        <button type="submit">Add to Gallery</button>
      </form>
    </div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <header>
      <div class="logo-wrapper">
        S
        <div class="logo-img">
          <img src="icons/pinterest.png" alt="pinterest" />
        </div>
        Brest
      </div>

      <button class="open-modal-button" id="openModalButton">
        Add Your Image
      </button>
    </header>

    <div class="gallery-container" id="galleryContainer">
      <div class="image-list-container" id="imageListContainer">
        <button class="scroll-to-top" id="scrollToTop" style="display: none">
          ↑
        </button>
        <div class="image-grid" id="imageGrid"></div>
        <div class="loading-indicator" id="loadingIndicator">Loading...</div>
      </div>

      <div class="resize-handle" id="resizeHandle"></div>

      <div class="preview-container" id="previewContainer">
        <div class="preview-content" id="previewContent">
          <div class="preview-placeholder">
            <p>Select an image to preview</p>
          </div>
        </div>
      </div>
    </div>

    <div class="drag-coordinates" id="dragCoordinates"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
